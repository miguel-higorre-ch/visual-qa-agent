name: "📋 User Story"
description: "New user story for the Visual QA Agent backlog"
title: "[Story] "
labels: ["user-story"]
body:
  - type: dropdown
    id: prioridad
    attributes:
      label: Priority
      options:
        - MVP
        - Nice-to-have
        - Out of scope
    validations:
      required: true

  - type: textarea
    id: historia
    attributes:
      label: User story
      description: "Format: As a [role], I want [action], so that [benefit]"
      placeholder: |
        As a QA/dev, I want to upload a baseline screenshot and a current one,
        so that I can know if something broke visually.
    validations:
      required: true

  - type: textarea
    id: criterios
    attributes:
      label: Acceptance criteria
      description: "List of conditions that must be met to consider the story complete"
      placeholder: |
        - [ ] Both images can be uploaded to S3
        - [ ] The endpoint responds with valid JSON
        - [ ] The dashboard displays the result
    validations:
      required: true

  - type: dropdown
    id: componente
    attributes:
      label: Component
      options:
        - App demo
        - Playwright / capture
        - Lambda / orchestration
        - Prompt / Bedrock
        - Dashboard
        - Deploy / infra
        - Documentation
    validations:
      required: false

  - type: input
    id: dia
    attributes:
      label: Day / Milestone
      placeholder: "Day 1 - Functional core"
    validations:
      required: false

  - type: textarea
    id: notas
    attributes:
      label: Additional notes
      placeholder: "Dependencies, known blockers, references to the source of truth document, etc."
    validations:
      required: false
